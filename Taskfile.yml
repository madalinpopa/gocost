version: '3'

vars:
  # Base version variable, can be overridden by environment variable or CLI argument
  VERSION: '{{.VERSION | default "dev"}}'

tasks:
  default:
    desc: Default task (runs tests)
    cmds:
      - task: test

  bootstrap:
    desc: Bootstrap project for development
    cmds:
      - cp ./envrc.template .envrc
      - go mod download
      - direnv allow .

  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #   Build
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  build:
    desc: Build the development binary
    cmds:
      - go build -ldflags="-X main.version=dev" -o bin/gocost-dev ./cmd/gocost

  build:linux:
    desc: Build for Linux AMD64
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: 0
    cmds:
      - go build -ldflags="-s -w -X main.version={{.VERSION}}" -trimpath -o bin/gocost-linux-amd64 ./cmd/gocost

  build:windows:
    desc: Build for Windows AMD64
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: 0
    cmds:
      - go build -ldflags="-s -w -X main.version={{.VERSION}}" -trimpath -o bin/gocost-windows-amd64.exe ./cmd/gocost

  build:darwin:
    desc: Build for Darwin ARM64
    env:
      GOOS: darwin
      GOARCH: arm64
      CGO_ENABLED: 0
    cmds:
      - go build -ldflags="-s -w -X main.version={{.VERSION}}" -trimpath -o bin/gocost-darwin-arm64 ./cmd/gocost

  build:all:
    desc: Build for all supported platforms (linux, windows, darwin)
    deps:
      - build:linux
      - build:windows
      - build:darwin

  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #   Test
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  test:
    desc: Run standard package unit tests
    cmds:
      - go test ./...

  test:race:
    desc: Run package tests with data race detection enabled
    cmds:
      - go test -race ./...

  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #   Lint
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

  lint:
    desc: Run static code analysis tools (vet and staticcheck)
    deps:
      - golangci
      - vuln

  golangci:
    desc: Run golangci-lint command
    cmds:
      - golangci-lint run ./...

  vuln:
    desc: Run govulngcheck command
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  tidy:
    desc: Verify go.mod is tidy
    silent: true
    cmds:
      - go mod tidy
      - |
        if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
          echo "go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the changes."
          exit 1
        fi

  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  #   Release
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  release:patch:
    desc: Automate tag increment for a patch release
    cmds:
      - |
        if [ $(git tag | wc -l) -eq 0 ]; then
          NEW_TAG="v0.0.1"
        else
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          MAJOR=$(echo $LATEST_TAG | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo $LATEST_TAG | cut -d. -f2)
          PATCH=$(echo $LATEST_TAG | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v$MAJOR.$MINOR.$NEW_PATCH"
        fi
        git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
        echo "Created new tag: $NEW_TAG"

  release:minor:
    desc: Automate tag increment for a minor release
    cmds:
      - |
        if [ $(git tag | wc -l) -eq 0 ]; then
          NEW_TAG="v0.1.0"
        else
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          MAJOR=$(echo $LATEST_TAG | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo $LATEST_TAG | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_TAG="v$MAJOR.$NEW_MINOR.0"
        fi
        git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
        echo "Created new tag: $NEW_TAG"

  release:major:
    desc: Automate tag increment for a major release
    cmds:
      - |
        if [ $(git tag | wc -l) -eq 0 ]; then
          NEW_TAG="v1.0.0"
        else
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          MAJOR=$(echo $LATEST_TAG | cut -d. -f1 | tr -d 'v')
          NEW_MAJOR=$((MAJOR + 1))
          NEW_TAG="v$NEW_MAJOR.0.0"
        fi
        git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
        echo "Created new tag: $NEW_TAG"
